name: Build DRONEMAN APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }

      - name: Unzip valid package
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found $ZIP"
          unzip -o "$ZIP" -d .
          ls -la DRONEMAN_EXACT/app/src/main/res/mipmap-xxxhdpi/

      - name: Build with exact icon
        run: |
          cd DRONEMAN_EXACT
          gradle assembleDebug --stacktrace

      - name: Upload APK with exact icon
        uses: actions/upload-artifact@v4
        with:
          name: DRONEMAN-EXACT-ICON-direct-install
          path: "**/app-debug.apk"
